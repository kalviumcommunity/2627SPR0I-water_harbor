name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waterpoint_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waterpoint_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/waterpoint_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/waterpoint_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waterpoint_db -c "SELECT 1 FROM pg_database WHERE datname='waterpoint_test_db'" | grep -q 1 || psql -h localhost -U postgres -d waterpoint_db -c "CREATE DATABASE waterpoint_test_db;"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run test database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/waterpoint_test_db
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -v
