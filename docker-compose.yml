
services:
  db:
    image: postgres:17-alpine
    container_name: water_harbor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gowrish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterharbor_dev}
      POSTGRES_DB: ${POSTGRES_DB:-waterpoint_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gowrish} -d ${POSTGRES_DB:-waterpoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water_harbor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gowrish}:${POSTGRES_PASSWORD:-waterharbor_dev}@db:5432/${POSTGRES_DB:-waterpoint_db}
      STAFF_API_KEY: ${STAFF_API_KEY:-campus-staff-key-2026}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: water_harbor_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

