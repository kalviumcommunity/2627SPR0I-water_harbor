# ── frontend/nginx.conf ────────────────────────────────────────────────────
# Minimal Nginx configuration for a Vite SPA.
# - Serves static files from /usr/share/nginx/html.
# - Falls back to index.html for all client-side routes (React Router).
# - Gzip compression for text assets.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Cache-busted assets (Vite adds content hashes)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
